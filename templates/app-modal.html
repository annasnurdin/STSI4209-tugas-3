<template id="tpl-modal">
  <div v-show="show" class="modal-overlay" @click.self="$emit('cancel')">
    <div class="modal-content">
      <div class="modal-header">
        <span>{{ title }}</span>
      </div>
      <div class="modal-body">
        <p style="margin: 0;">{{ message }}</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-batal" style="margin-left: 0; margin-right: 8px;" @click="$emit('cancel')">
          Batal
        </button>
        <button type="button" class="btn-hapus" style="padding: 8px 16px; font-size: 14px;" @click="$emit('confirm')">
          Ya, Hapus
        </button>
      </div>
    </div>
  </div>
</template>
