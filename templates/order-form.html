<template id="tpl-order">
  <section class="card">
    <h3 style="margin-top: 0; margin-bottom: 15px; color: #004080;">Input Delivery Order (DO) Baru</h3>

    <form @submit.prevent="simpanDO">
      <div class="form-stok-grid">
        <div class="form-group">
          <label for="nomorDO">Nomor DO (Otomatis)</label>
          <input type="text" id="nomorDO" :value="nomorDOBaru" readonly>
        </div>

        <div class="form-group">
          <label for="nim">NIM Mahasiswa</label>
          <input type="text" id="nim" v-model.trim="formDO.nim" placeholder="Masukkan NIM (misal: 123456789)">
          <span v-if="errors.nim" class="form-error">{{ errors.nim }}</span>
        </div>

        <div class="form-group">
          <label for="nama">Nama Mahasiswa</label>
          <input type="text" id="nama" v-model.trim="formDO.nama" placeholder="Nama mahasiswa">
          <span v-if="errors.nama" class="form-error">{{ errors.nama }}</span>
        </div>

        <div class="form-group">
          <label for="ekspedisi">Jasa Ekspedisi</label>
          <select id="ekspedisi" v-model="formDO.ekspedisi">
            <option value="" disabled>-- Pilih Ekspedisi --</option>
            <option v-for="e in pengirimanList" :key="e.kode" :value="e.nama">{{ e.nama }}</option>
          </select>
          <span v-if="errors.ekspedisi" class="form-error">{{ errors.ekspedisi }}</span>
        </div>

        <div class="form-group">
          <label for="paketKode">Paket Bahan Ajar</label>
          <select id="paketKode" v-model="formDO.paketKode">
            <option value="" disabled>-- Pilih Paket Bahan Ajar --</option>
            <option v-for="p in paket" :key="p.kode" :value="p.kode">
              {{ p.kode }} - {{ p.nama }}
            </option>
          </select>
          <span v-if="errors.paketKode" class="form-error">{{ errors.paketKode }}</span>

          <div v-show="selectedPaket" class="detail-paket-box">
            <strong>Detail Isi Paket:</strong>
            <div v-if="selectedPaket" style="margin-top: 5px;">
              <span v-for="buku in selectedPaket.isi" :key="buku" class="badge-item">{{ buku }}</span>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="tanggalKirim">Tanggal Kirim</label>
          <div style="display: flex; gap: 6px;">
            <input type="date" id="tanggalKirim" v-model="formDO.tanggalKirim">
            <button type="button" class="btn-secondary" style="white-space: nowrap; padding: 6px 12px; font-size: 13px;" @click="setTanggalHariIni">Hari Ini</button>
          </div>
          <small v-if="formDO.tanggalKirim" style="color: #666; font-size: 12px; margin-top: 4px; display: block;">
            Format: {{ formDO.tanggalKirim | formatTanggal }}
          </small>
          <span v-if="errors.tanggalKirim" class="form-error">{{ errors.tanggalKirim }}</span>
        </div>

        <div class="form-group">
          <label for="total">Total Harga (Otomatis)</label>
          <input type="text" id="total" :value="formDO.total | rupiah" readonly style="font-weight: bold; color: #004080;">
        </div>
      </div>

      <div style="display: flex; gap: 10px; align-items: center;">
        <button type="submit">Simpan &amp; Terbitkan DO</button>
        <span v-if="successMessage" style="color: #155724; font-size: 13px; font-weight: bold;">
          &#10004; {{ successMessage }}
        </span>
      </div>
    </form>
  </section>
</template>
